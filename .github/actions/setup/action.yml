name: setup
description: >-
  Everything a heed build needs on a hosted macOS runner: the mise tools, Xcode for the SDK and its Metal toolchain (MLX
  and GhosttyKit compile Metal shaders), the Swift toolchain the package asks for (hosted runners lag behind Xcode
  releases, so it comes from swift.org), and GhosttyKit built from the pinned Ghostty commit. The toolchain and
  GhosttyKit are cached, and SwiftPM's .build is restored from the newest build of main (which ci saves).

inputs:
  swift:
    description: Swift toolchain version from swift.org
    default: "6.4.1"
  xcode:
    description: Xcode on the runner, for the macOS SDK and the Metal toolchain
    default: "26.6"
  cache:
    description: Which .build cache, one per ci job (test builds debug, build builds release)
    default: build

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2

    - name: Select Xcode ${{ inputs.xcode }}
      shell: bash
      run: sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode }}.app"

    - name: Restore the Swift ${{ inputs.swift }} toolchain
      id: swift-cache
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Toolchains/swift-${{ inputs.swift }}-RELEASE.xctoolchain
        key: swift-toolchain-${{ inputs.swift }}

    - name: Install the Swift ${{ inputs.swift }} toolchain
      if: steps.swift-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        version="${{ inputs.swift }}"
        pkg="$RUNNER_TEMP/swift.pkg"
        curl -fsSL -o "$pkg" \
          "https://download.swift.org/swift-$version-release/xcode/swift-$version-RELEASE/swift-$version-RELEASE-osx.pkg"
        installer -pkg "$pkg" -target CurrentUserHomeDirectory

    - name: Use the Swift ${{ inputs.swift }} toolchain
      shell: bash
      run: |
        toolchain="$HOME/Library/Developer/Toolchains/swift-${{ inputs.swift }}-RELEASE.xctoolchain"
        echo "TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw "$toolchain/Info.plist")" >>"$GITHUB_ENV"

    - name: Show the toolchain
      shell: bash
      run: swift --version

    # MLX (through Hunch) compiles its Metal shaders while heed builds, and GhosttyKit needs them too. The runner's Xcode
    # does not always carry the Metal toolchain, and a cached GhosttyKit skips the step below that installs it.
    - name: Install the Metal toolchain
      shell: bash
      run: xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

    - name: Read the Ghostty pin
      id: ghostty
      shell: bash
      run: echo "commit=$(mise env --json | jq -r .GHOSTTY_COMMIT)" >>"$GITHUB_OUTPUT"

    - name: Restore GhosttyKit
      id: ghostty-cache
      uses: actions/cache@v4
      with:
        path: Vendor
        key: ghosttykit-${{ steps.ghostty.outputs.commit }}-xcode-${{ inputs.xcode }}-${{ runner.arch }}

    - name: Build GhosttyKit
      if: steps.ghostty-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
        mise run ghostty

    # Incremental builds: .build from the newest build of main with the same toolchain, Xcode and dependencies (or,
    # failing that, any of them). Only ci on main saves it, so pull requests and releases read it.
    - name: Name the build cache
      shell: bash
      run: |
        base="swiftpm-${{ inputs.cache }}-${{ runner.arch }}-swift-${{ inputs.swift }}-xcode-${{ inputs.xcode }}"
        echo "SWIFTPM_CACHE_BASE=$base" >>"$GITHUB_ENV"
        echo "SWIFTPM_CACHE_KEY=$base-${{ hashFiles('Package.resolved') }}-${{ github.sha }}" >>"$GITHUB_ENV"
        echo "SWIFTPM_CACHE_DEPS=$base-${{ hashFiles('Package.resolved') }}-" >>"$GITHUB_ENV"

    - name: Restore .build
      uses: actions/cache/restore@v4
      with:
        path: .build
        key: ${{ env.SWIFTPM_CACHE_KEY }}
        restore-keys: |
          ${{ env.SWIFTPM_CACHE_DEPS }}
          ${{ env.SWIFTPM_CACHE_BASE }}-

    # A build description names the tools by absolute path, and the Metal compiler lives under a cryptex mount whose
    # name differs per runner; a restored description fails with "unable to spawn .../Metal.xctoolchain/usr/bin/metal".
    # Dropping the descriptions makes the build plan again with this runner's tools; build.db and the compiled
    # products stay, so the build is still incremental.
    - name: Forget the restored build descriptions
      shell: bash
      run: |
        data=.build/out/Intermediates.noindex/XCBuildData
        [ -d "$data" ] || exit 0
        rm -rf "$data"/*.xcbuilddata "$data/prior-build-descriptions.txt"
