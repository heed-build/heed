name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, the tests, a release build, and the tutor played with the real keys: what `mise run lint test bundle
  # tutor-check` does locally.
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Lint
        run: mise run lint

      # The pane launch tests start agents in every login shell a pane can have; the runner has zsh and bash, not fish.
      - name: fish
        run: brew install fish

      - name: Test
        run: mise run test

      - name: Release build
        run: mise run bundle

      # What the release workflow attaches for the updater: well-formed, and carrying what Sparkle reads.
      - name: Appcast
        run: |
          printf '<h2>Fixes</h2><p>a ]]> b</p>\n' >"$RUNNER_TEMP/notes.html"
          scripts/appcast.sh 1.2.3 42 c2lnbmF0dXJl 1234 "$RUNNER_TEMP/notes.html" >"$RUNNER_TEMP/appcast.xml"
          xmllint --noout "$RUNNER_TEMP/appcast.xml"
          for wanted in '<sparkle:version>42</sparkle:version>' '<sparkle:shortVersionString>1.2.3' \
            'length="1234"' 'sparkle:edSignature="c2lnbmF0dXJl"' 'download/v1.2.3/Heed-arm64.zip'; do
            grep -qF "$wanted" "$RUNNER_TEMP/appcast.xml" || { echo "appcast lacks $wanted" >&2; exit 1; }
          done
          ls build/Heed.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate >/dev/null

      - name: Tutor check
        run: HEED_TUTOR_CHECK=1 build/Heed.app/Contents/MacOS/Heed

  # The docs build as docs.yml publishes it, without publishing.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build documentation
        uses: elastic/docs-builder@main
