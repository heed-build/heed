name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two jobs side by side, each on its own runner and its own .build cache: what `mise run lint test` and
  # `mise run bundle tutor-check` do locally. A release waits for both on its commit.
  test:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # prune-caches deletes old .build caches
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          cache: test

      - name: Lint
        run: mise run lint

      # The pane launch tests start agents in every login shell a pane can have; the runner has zsh and bash, not fish.
      - name: fish
        run: brew install fish

      # HeedCore and the tests only: the test product needs neither the app, MLX, Sparkle nor GhosttyKit (the build job
      # compiles those). Incremental: the setup action pinned the files' times, so only what changed since main's
      # cached build compiles, and its log is what text-check reads.
      - name: Build the tests
        shell: bash
        run: swift build --product HeedPackageTests 2>&1 | tee "$RUNNER_TEMP/build-tests.log"

      - name: Test
        id: test
        shell: bash
        run: mise run test --skip-build 2>&1 | tee "$RUNNER_TEMP/test-1.log"

      # On main the suite runs a second time, on the same build, and a test that fails in only one of the two runs
      # fails the job by name as flaky. Nothing is retried: a flake is a bug to fix, not to hide. Pull requests run once.
      - name: Test again for flakes
        if: >-
          !cancelled() && github.event_name == 'push'
          && (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        shell: bash
        run: |
          status=0
          mise run test --skip-build 2>&1 | tee "$RUNNER_TEMP/test-2.log" || status=$?
          scripts/flaky-tests.sh "$RUNNER_TEMP/test-1.log" "$RUNNER_TEMP/test-2.log"
          exit "$status"

      # Reads the warnings of that build (HeedCore and the tests; the build job checks the app's): other people's text
      # in a plain String fails here. A file that did not recompile was clean when main's build compiled it, and one
      # that depends on a changed declaration (the deprecations in Prompt.swift) does recompile. Runs after the tests so
      # a failing test is not hidden behind it.
      - name: Text check
        if: "!cancelled()"
        run: scripts/text-check.sh "$RUNNER_TEMP/build-tests.log"

      # main's .build, for the next run to build on (see the setup action); pull requests only read it.
      - name: Save .build
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ env.SWIFTPM_CACHE_KEY }}

      # The repository's cache allowance is 10 GB and each of these is about 700 MB: keep this job's newest two.
      - name: Prune older .build caches
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/prune-caches.sh "$SWIFTPM_CACHE_BASE-"

  # The app compiled in debug (incremental: the setup action pinned the files' times, so only what changed since main's
  # cached build compiles) and the tutor played with the real keys on it. The release build is the next job, on main only.
  build:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # prune-caches deletes old .build caches
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          cache: build

      - name: Debug build
        shell: bash
        run: |
          swift build 2>&1 | tee "$RUNNER_TEMP/debug.log"
          scripts/bundle.sh debug

      # The log has the warnings of what compiled (HeedCore, the helper and the app); the test job reads the tests'.
      - name: Text check
        run: scripts/text-check.sh "$RUNNER_TEMP/debug.log"

      # What the release workflow attaches for the updater: well-formed, and carrying what Sparkle reads.
      - name: Appcast
        run: |
          printf '<h2>Fixes</h2><p>a ]]> b</p>\n' >"$RUNNER_TEMP/notes.html"
          scripts/appcast.sh 1.2.3 42 c2lnbmF0dXJl 1234 "$RUNNER_TEMP/notes.html" >"$RUNNER_TEMP/appcast.xml"
          xmllint --noout "$RUNNER_TEMP/appcast.xml"
          for wanted in '<sparkle:version>42</sparkle:version>' '<sparkle:shortVersionString>1.2.3' \
            'length="1234"' 'sparkle:edSignature="c2lnbmF0dXJl"' 'download/v1.2.3/Heed-arm64.zip'; do
            grep -qF "$wanted" "$RUNNER_TEMP/appcast.xml" || { echo "appcast lacks $wanted" >&2; exit 1; }
          done
          ls build/Heed.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate >/dev/null

      # The script `mise run tutor-check` runs, without its bundle step: it fails when the app prints no summary line.
      - name: Tutor check
        run: scripts/tutor-check.sh

      - name: Save .build
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ env.SWIFTPM_CACHE_KEY }}

      # The repository's cache allowance is 10 GB and each of these is about 1 GB: keep this job's newest two.
      - name: Prune older .build caches
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/prune-caches.sh "$SWIFTPM_CACHE_BASE-"

  # The release build, as the release workflow builds it, on main only: whole-module, so it cannot be incremental and
  # takes the longest of anything here, and a pull request would wait for it. A release-only break shows up on the merge
  # (and the release workflow builds it again before it publishes); its .build is what that workflow restores.
  release-build:
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # prune-caches deletes old .build caches
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          cache: release

      - name: Release build
        run: mise run bundle

      - name: Save .build
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ env.SWIFTPM_CACHE_KEY }}

      - name: Prune older .build caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/prune-caches.sh "$SWIFTPM_CACHE_BASE-"

  # The docs build as docs.yml publishes it, without publishing.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # As .github/workflows/docs.yml builds it, so a PR proves the deploy's build and post-build steps.
      - name: Build documentation
        uses: elastic/docs-builder@main
        env:
          FEATURE_NAVIGATION_PREVIEW: true

      - name: Theme and landing page
        run: scripts/docs-finish.sh .artifacts/docs/html
