name: release

# The release step, run by hand (Actions > release > Run workflow, or `gh workflow run release`): builds main at the
# version release-drafter worked out (or the one given), attaches the app to the draft, checks it is there, and only
# then publishes the draft, which creates the tag on the commit that was built. A published release always has its
# files.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (empty: the draft's)"
        required: false
      dry_run:
        description: "Dry run: build, sign and notarize, keep the zip on the run, release nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Releases come from main; a dry run may try a branch.
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signing and notarizing need all six secrets (scripts/release-secrets.sh stores them); without them the release
      # is ad-hoc signed, which the install script handles but browsers and Homebrew warn about.
      NOTARIZE: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Find the draft
        id: draft
        run: |
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft)][0] // empty')"
          if [ -z "$draft" ]; then
            echo "No draft release: release-drafter makes one when a pull request merges." >&2
            exit 1
          fi
          tag="$(jq -r .tag_name <<<"$draft")"
          wanted="${{ inputs.version }}"
          if [ -n "$wanted" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            tag="v$wanted"
          elif [ -n "$wanted" ] && [ "v$wanted" != "$tag" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$(jq -r .id <<<"$draft")" \
              -f tag_name="v$wanted" -f name="v$wanted" >/dev/null
            tag="v$wanted"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already released." >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup

      - name: Test
        run: mise run test

      - name: Release build
        env:
          HEED_VERSION: ${{ steps.draft.outputs.version }}
        run: |
          mise run bundle
          shown="$(plutil -extract CFBundleShortVersionString raw build/Heed.app/Contents/Info.plist)"
          [ "$shown" = "$HEED_VERSION" ] || { echo "Info.plist says $shown, not $HEED_VERSION" >&2; exit 1; }

      - name: Sign with the Developer ID
        if: env.NOTARIZE == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # A keychain of its own, deleted when the job ends (see the last step).
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$P12" >"$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          # The intermediate certificate, so codesign can build the chain to Apple.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | tr -d '"' | head -1)"
          [ -n "$identity" ] || { echo "No Developer ID Application identity in DEVELOPER_ID_P12" >&2; exit 1; }
          scripts/sign.sh "$identity" "$keychain"

      - name: Tutor check
        run: HEED_TUTOR_CHECK=1 build/Heed.app/Contents/MacOS/Heed

      - name: Notarize and staple
        if: env.NOTARIZE == 'true'
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$KEY_P8" >"$key"
          auth=(--key "$key" --key-id "$KEY_ID" --issuer "$ISSUER")
          ditto -c -k --keepParent build/Heed.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${auth[@]}" --wait --timeout 30m \
            --output-format json >"$RUNNER_TEMP/notary.json" || true
          status="$(jq -r '.status // "no answer"' "$RUNNER_TEMP/notary.json")"
          id="$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json")"
          echo "notarization: $status ($id)"
          if [ "$status" != "Accepted" ]; then
            # Apple's reasons, then stop: nothing has been attached to the draft.
            [ -n "$id" ] && xcrun notarytool log "$id" "${auth[@]}"
            rm -f "$key"
            exit 1
          fi
          rm -f "$key"
          xcrun stapler staple build/Heed.app
          xcrun stapler validate build/Heed.app
          # What Gatekeeper will say on someone else's Mac.
          spctl --assess --type execute -vv build/Heed.app 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl.txt"

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Heed.app dist/Heed-arm64.zip
          (cd dist && shasum -a 256 Heed-arm64.zip >Heed-arm64.zip.sha256)
          cat dist/Heed-arm64.zip.sha256

      - name: Keep the zip on the run
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: Heed-${{ steps.draft.outputs.version }}-dry-run
          path: dist/*

      - name: Attach to the draft
        if: ${{ !inputs.dry_run }}
        run: gh release upload "${{ steps.draft.outputs.tag }}" dist/* --clobber

      - name: Check the draft has both files
        if: ${{ !inputs.dry_run }}
        run: |
          names="$(gh release view "${{ steps.draft.outputs.tag }}" --json assets --jq '[.assets[].name] | sort | join(" ")')"
          [ "$names" = "Heed-arm64.zip Heed-arm64.zip.sha256" ] || { echo "draft has: $names" >&2; exit 1; }

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: gh release edit "${{ steps.draft.outputs.tag }}" --draft=false --latest --target "$GITHUB_SHA"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
