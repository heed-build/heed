[tools]
zig = "0.16.0"          # GhosttyKit (libghostty) build
swiftformat = "0.58"
swiftlint = "0.61"

[env]
BUILD_DIR = "{{config_root}}/build"
# The upstream Ghostty commit GhosttyKit is built from. ghostty.h is Ghostty's internal embedding API, so bump this
# deliberately and fix Sources/HeedTerminal in the same commit.
GHOSTTY_COMMIT = "1e9e14af5df14211892f5fc15fd21a49c7d94868"

[tasks.doctor]
description = "Check the toolchain: Xcode selected, its licence, the Metal toolchain, Zig, gh"
run = "scripts/doctor.sh"

[tasks.ghostty]
description = "Build Vendor/GhosttyKit.xcframework from Ghostty at $GHOSTTY_COMMIT"
run = "scripts/ghostty.sh"
sources = ["mise.toml", "scripts/ghostty.sh"]
outputs = ["Vendor/GhosttyKit.xcframework/Info.plist"]

[tasks.build]
description = "Debug build, assemble build/Heed.app, then copy it to HEED_DEPLOY_DIR if set"
run = ["swift build", "scripts/bundle.sh debug", "scripts/deploy.sh"]

[tasks.dev]
description = "Build and launch Heed.app"
depends = ["build"]
run = "open $BUILD_DIR/Heed.app"

[tasks.test]
description = "Swift Testing suite"
run = "swift test --quiet"

[tasks.fmt]
description = "Format Swift sources"
run = "swiftformat Sources Tests Package.swift"

[tasks.lint]
description = "Check formatting and lint"
run = ["swiftformat Sources Tests Package.swift --lint", "swiftlint lint --quiet Sources Tests"]

[tasks.bundle]
description = "Release build, ad-hoc signed build/Heed.app"
run = ["swift build -c release", "scripts/bundle.sh release"]

[tasks.docs]
description = "Build the docs as CI does (docs-builder + landing page) and serve them on :4000 (-- --noserve to only build)"
run = "scripts/docs.sh"

[tasks.shots]
description = "Render every docs screenshot from the fake world into docs/images/shots, and the generated reference pages (HEED_SHOTS_ONLY=<prefix> for some shots)"
depends = ["bundle"]
run = "HEED_SHOTS=\"$PWD/docs/images/shots\" HEED_DOCS=\"$PWD/docs\" build/Heed.app/Contents/MacOS/Heed"

[tasks.tutor-check]
description = "Play every tutor lesson with the real keys on its fake world, and report steps that do not tick off"
depends = ["bundle"]
run = "HEED_TUTOR_CHECK=1 build/Heed.app/Contents/MacOS/Heed"

[tasks.deploy]
description = "Copy build/Heed.app to HEED_DEPLOY_DIR (set it in mise.local.toml)"
run = "scripts/deploy.sh"
